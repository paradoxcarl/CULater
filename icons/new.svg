<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景漸層 -->
    <linearGradient id="bgGrad16" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EBF5FB"/>
      <stop offset="100%" stop-color="#D4E6F1"/>
    </linearGradient>

    <!-- 口袋本體漸層 -->
    <linearGradient id="pocketGrad16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3498DB"/>
      <stop offset="60%" stop-color="#2980B9"/>
      <stop offset="100%" stop-color="#1B4F72"/>
    </linearGradient>

    <!-- 書籤漸層 -->
    <linearGradient id="bookmarkGrad16" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E67E22"/>
      <stop offset="100%" stop-color="#BA4A00"/>
    </linearGradient>

    <!-- 口袋反摺邊條 3D 漸層 -->
    <linearGradient id="foldGrad16" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5499C7"/>
      <stop offset="50%" stop-color="#2980B9"/>
      <stop offset="100%" stop-color="#154360"/>
    </linearGradient>

    <!-- 口袋陰影 -->
    <filter id="cleanPocketShadow16" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1B4F72" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.1"/>
    </filter>

    <!-- 書籤陰影 -->
    <filter id="cleanBookmarkShadow16" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App Icon 外框 -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad16)" stroke="#FFFFFF" stroke-width="4"/>

  <!-- 主要圖形群組 -->
  <g>
    
    <!-- 往上且向右橫移的斜向書籤群組 -->
    <g transform="translate(291, -45) rotate(18) translate(-256, 45)">
      
      <!-- 1. 繩子背後段 -->
      <path d="M 330 128 
               C 315 96, 345 81, 358 94" 
            fill="none" 
            stroke="#D35400" 
            stroke-width="5" 
            stroke-linecap="round" 
            opacity="0.8"/>

      <!-- 2. 書籤本體 -->
      <g filter="url(#cleanBookmarkShadow16)">
        <path d="M 290 106 
                 L 370 106 
                 C 378 106, 384 112, 384 120 
                 L 384 266 
                 C 384 271, 378 276, 373 273 
                 L 330 246 
                 L 287 273 C 282 276, 276 271, 276 266 
                 L 276 120 
                 C 276 112, 282 106, 290 106 Z" 
              fill="url(#bookmarkGrad16)"/>
        <circle cx="330" cy="128" r="7" fill="#6E2C00"/>
      </g>

      <!-- 3. 繩子前方段 -->
      <path d="M 358 94 
               C 365 101, 355 121, 330 128" 
            fill="none" 
            stroke="#F39C12" 
            stroke-width="5" 
            stroke-linecap="round"/>
    </g>

    <!-- 4. 口袋與立體反摺邊條 -->
    <g filter="url(#cleanPocketShadow16)">
      <!-- 口袋主體 -->
      <path d="M 120 190 
               L 392 190 
               C 398 190, 402 194, 402 200 
               L 402 280 
               C 402 360, 336 420, 256 420 
               C 176 420, 110 360, 110 280 
               L 110 200 
               C 110 194, 114 190, 120 190 Z" 
            fill="url(#pocketGrad16)"/>

      <!-- 立體反摺邊條 -->
      <path d="M 112 176 
               L 400 176 
               C 404 176, 408 180, 408 186 
               L 408 196 
               C 408 200, 404 204, 400 204 
               L 112 204 
               C 108 204, 104 200, 104 196 
               L 104 186 
               C 104 180, 108 176, 112 176 Z" 
            fill="url(#foldGrad16)"/>
      
      <!-- 邊條上的固定縫線 -->
      <path d="M 120 190 L 392 190" stroke="#154360" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round" opacity="0.8"/>

      <!-- 口袋內部對稱縫線與虛線 -->
      <path d="M 136 215 
               L 376 215 
               L 376 280 
               C 376 342, 322 396, 256 396 
               C 190 396, 136 342, 136 280 Z" 
            fill="none" 
            stroke="#154360" 
            stroke-width="2.5" 
            opacity="0.35"/>
      
      <path d="M 138 217 
               L 374 217 
               L 374 280 
               C 374 342, 322 396, 256 396 
               C 190 396, 138 342, 138 280 Z" 
            fill="none" 
            stroke="#D6EAF8" 
            stroke-width="2.5" 
            stroke-dasharray="6 6" 
            stroke-linecap="round" 
            opacity="0.85"/>
    </g>

  </g>
</svg>
