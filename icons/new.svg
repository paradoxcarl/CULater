<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景漸層 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F9F9FB"/>
      <stop offset="100%" stop-color="#E4E7EB"/>
    </linearGradient>

    <!-- 口袋漸層 -->
    <linearGradient id="pocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34495E"/>
      <stop offset="100%" stop-color="#1A252F"/>
    </linearGradient>

    <!-- 書籤漸層 -->
    <linearGradient id="bookmarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7675"/>
      <stop offset="100%" stop-color="#D63031"/>
    </linearGradient>

    <!-- 書籤裝飾線條漸層 -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="100%" stop-color="#FDCB6E"/>
    </linearGradient>

    <!-- 陰影濾鏡 -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2C3E50" flood-opacity="0.18"/>
    </filter>

    <filter id="bookmarkShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 應用程式圖示外框 -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" stroke="#FFFFFF" stroke-width="4"/>

  <!-- 主要圖形群組 -->
  <g filter="url(#softShadow)">
    
    <!-- 書籤（置於口袋後方） -->
    <g filter="url(#bookmarkShadow)">
      <!-- 書籤本體 -->
      <path d="M 276 130 
               L 348 130 
               C 354.6 130, 360 135.4, 360 142 
               L 360 290 
               L 318 258 
               L 276 290 
               L 276 142 
               C 276 135.4, 281.4 130, 288 130 Z" 
            fill="url(#bookmarkGrad)"/>
      
      <!-- 書籤中央黃色線條裝飾 -->
      <path d="M 310 130 
               L 326 130 
               L 326 250 
               L 318 244 
               L 310 250 Z" 
            fill="url(#ribbonGrad)" 
            opacity="0.95"/>
    </g>

    <!-- 極簡口袋本體 -->
    <path d="M 140 180 
             L 372 180 
             C 378.6 180, 384 185.4, 384 192 
             L 384 280 
             C 384 350, 326 400, 256 400 
             C 186 400, 128 350, 128 280 
             L 128 192 
             C 128 185.4, 133.4 180, 140 180 Z" 
          fill="url(#pocketGrad)"/>

    <!-- 口袋左側陰影（增添立體感） -->
    <path d="M 140 180 
             L 256 180 
             L 256 400 
             C 186 400, 128 350, 128 280 
             L 128 192 
             C 128 185.4, 133.4 180, 140 180 Z" 
          fill="#000000" 
          opacity="0.08"/>

    <!-- 口袋邊緣虛線縫線細節 -->
    <path d="M 148 196 
             L 364 196 
             L 364 280 
             C 364 338, 314 384, 256 384 
             C 198 384, 148 338, 148 280 Z" 
          fill="none" 
          stroke="#7F8C8D" 
          stroke-width="3" 
          stroke-dasharray="8 8" 
          stroke-linecap="round" 
          opacity="0.6"/>

    <!-- 口袋開口高光線條 -->
    <line x1="132" y1="182" x2="380" y2="182" stroke="#5D6D7E" stroke-width="3" stroke-linecap="round"/>

  </g>
</svg>
