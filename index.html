<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F9F8">
  <meta name="description" content="CULater 個人稍後閱讀與收藏工具">
  <link rel="manifest" href="./manifest.json">
  <title>CULater｜稍後閱讀</title>

  <style>
    :root {
      --sky: #BFE6F1;
      --sky-deep: #75BFD2;
      --mint: #B7E2D7;
      --mint-deep: #559D91;
      --bg: #F5F9F8;
      --white: #FFFFFF;
      --ink: #294B53;
      --muted: #8AA3A4;
      --line: #E8F0EE;
      --shadow: 0 8px 28px rgba(68, 119, 120, .10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC",
        "Microsoft JhengHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .app {
      width: 100%;
      max-width: 600px;
      min-height: 100dvh;
      margin: auto;
      padding: 24px 20px calc(112px + env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .logo {
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -1px;
      color: #315D67;
    }

    .tagline {
      margin-top: 3px;
      font-size: 11px;
      letter-spacing: 1.4px;
      color: var(--muted);
    }

    .search-button {
      border: 0;
      background: #E3F2F3;
      color: #508F91;
      width: 43px;
      height: 43px;
      border-radius: 50%;
      font-size: 20px;
    }

    .search-area {
      display: none;
      margin-bottom: 18px;
    }

    .search-area.show { display: block; }

    .search-area input {
      width: 100%;
      padding: 14px 17px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: white;
      outline: none;
      color: var(--ink);
    }

    .welcome {
      padding: 21px;
      border-radius: 23px;
      background: linear-gradient(125deg, #DFF1F6, #DDF2E9);
      margin-bottom: 28px;
    }

    .welcome-label {
      font-size: 13px;
      color: #648B91;
    }

    .welcome-count {
      margin-top: 7px;
      font-size: 31px;
      font-weight: 750;
      color: #315D67;
    }

    .welcome-count span {
      font-size: 14px;
      font-weight: 500;
      color: #668B8E;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0 2px 15px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
    }

    .section-note {
      font-size: 12px;
      color: var(--muted);
    }

    .filter-bar {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      padding: 2px 0 17px;
      scrollbar-width: none;
    }

    .filter-bar::-webkit-scrollbar { display: none; }

    .filter {
      flex: 0 0 auto;
      border: 0;
      border-radius: 30px;
      padding: 9px 18px;
      background: #EDF3F1;
      color: #789392;
      font-size: 13px;
    }

    .filter.active {
      background: #D9F0E9;
      color: #438C80;
      font-weight: 700;
    }

    .items {
      display: grid;
      gap: 13px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 13px;
      background: white;
      border: 1px solid #EDF2F0;
      border-radius: 19px;
      padding: 13px;
      box-shadow: 0 4px 15px rgba(68, 119, 120, .045);
    }

    .item-icon {
      width: 62px;
      height: 62px;
      flex: 0 0 62px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 15px;
      font-size: 25px;
    }

    .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-title {
      font-size: 14px;
      line-height: 1.5;
      font-weight: 650;
      margin-bottom: 5px;
      overflow-wrap: anywhere;
    }

    .item-meta {
      color: var(--muted);
      font-size: 11px;
    }

    .item-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 8px;
    }

    .mini-tag {
      padding: 3px 8px;
      border-radius: 20px;
      background: #F0F7F5;
      color: #72968E;
      font-size: 10px;
    }

    .item-actions {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .action-btn {
      border: 0;
      background: transparent;
      color: #A3B8B4;
      font-size: 18px;
      padding: 3px;
    }

    .action-btn.selected { color: #E7A9A9; }

    .empty {
      padding: 45px 15px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .empty-icon {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .bottom-nav {
      position: fixed;
      z-index: 10;
      bottom: calc(15px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 560px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 9px 7px;
      border: 1px solid rgba(224, 237, 232, .9);
      border-radius: 27px;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 10px 35px rgba(56, 104, 104, .16);
      backdrop-filter: blur(16px);
    }

    .nav-button {
      border: 0;
      background: transparent;
      border-radius: 20px;
      padding: 8px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #91A8A5;
      font-size: 11px;
    }

    .nav-button .nav-icon { font-size: 20px; }

    .nav-button.active {
      color: #438F83;
      background: #E1F3EC;
      font-weight: 700;
    }

    .page-title {
      font-size: 23px;
      font-weight: 750;
      margin: 8px 0 6px;
    }

    .page-description {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 21px;
    }

    .group-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }

    .group-card {
      border: 1px solid var(--line);
      border-radius: 17px;
      background: white;
      padding: 17px 14px;
      text-align: left;
      color: var(--ink);
    }

    .group-card.active {
      border-color: #8CCFC0;
      background: #E9F6F1;
    }

    .group-name {
      font-size: 14px;
      font-weight: 650;
    }

    .group-count {
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
    }

    @media (min-width: 600px) {
      .app { padding-top: 35px; }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="logo">CULater.</div>
        <div class="tagline">SAVE NOW, READ LATER.</div>
      </div>
      <button class="search-button" id="searchToggle" aria-label="搜尋">⌕</button>
    </header>

    <div class="search-area" id="searchArea">
      <input id="searchInput" type="search" placeholder="搜尋收藏的內容……">
    </div>

    <section id="welcome" class="welcome">
      <div class="welcome-label">今天也留一點時間給自己</div>
      <div class="welcome-count">
        <span id="unreadCount">3</span>
        <span>則未讀收藏</span>
      </div>
    </section>

    <section>
      <div class="section-heading">
        <h2 id="sectionTitle">最近收藏</h2>
        <span class="section-note" id="sectionNote">慢慢閱讀，不必著急</span>
      </div>

      <div id="groupArea"></div>

      <div class="filter-bar" id="filterBar" style="display:none">
        <button class="filter active" data-filter="all">全部</button>
        <button class="filter" data-filter="unread">未讀</button>
        <button class="filter" data-filter="read">已讀</button>
      </div>

      <div class="items" id="itemList"></div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="主要選單">
    <button class="nav-button active" data-page="unread">
      <span class="nav-icon">◷</span>
      <span>未讀</span>
    </button>
    <button class="nav-button" data-page="category">
      <span class="nav-icon">▤</span>
      <span>分類</span>
    </button>
    <button class="nav-button" data-page="tag">
      <span class="nav-icon">⌗</span>
      <span>標籤</span>
    </button>
    <button class="nav-button" data-page="favorite">
      <span class="nav-icon">♡</span>
      <span>收藏</span>
    </button>
  </nav>

  <script>
    // 示範資料：之後會改為 Google Sheets 資料
    const items = [
      {
        id: 1,
        title: "東京旅行必去景點整理",
        category: "旅行",
        tags: ["東京", "日本旅遊"],
        icon: "🗼",
        color: "#DDEFF4",
        read: false,
        favorite: true
      },
      {
        id: 2,
        title: "北歐風居家佈置靈感",
        category: "居家",
        tags: ["室內設計", "收納"],
        icon: "🏡",
        color: "#E1F1E9",
        read: false,
        favorite: false
      },
      {
        id: 3,
        title: "值得收藏的料理食譜",
        category: "美食",
        tags: ["料理", "食譜"],
        icon: "🍵",
        color: "#F3EEDF",
        read: false,
        favorite: true
      },
      {
        id: 4,
        title: "旅行攝影構圖技巧",
        category: "旅行",
        tags: ["攝影", "技巧"],
        icon: "📷",
        color: "#E8E7F4",
        read: true,
        favorite: false
      },
      {
        id: 5,
        title: "簡單生活與整理習慣",
        category: "生活",
        tags: ["生活靈感", "整理"],
        icon: "🌿",
        color: "#E4F0E5",
        read: true,
        favorite: true
      }
    ];

    let currentPage = "unread";
    let currentFilter = "all";
    let selectedGroup = null;

    const itemList = document.getElementById("itemList");
    const filterBar = document.getElementById("filterBar");
    const groupArea = document.getElementById("groupArea");
    const welcome = document.getElementById("welcome");

    const pageInfo = {
      unread: ["未讀內容", "等待你慢慢探索的收藏"],
      category: ["分類", "依照主題整理你的收藏"],
      tag: ["標籤", "用關鍵字找到想看的內容"],
      favorite: ["我的收藏", "特別留下來的內容"]
    };

    function updateCount() {
      document.getElementById("unreadCount").textContent =
        items.filter(item => !item.read).length;
    }

    function getGroups() {
      if (currentPage === "category") {
        return [...new Set(items.map(item => item.category))];
      }

      if (currentPage === "tag") {
        return [...new Set(items.flatMap(item => item.tags))];
      }

      return [];
    }

    function renderGroups() {
      groupArea.innerHTML = "";
      groupArea.className = "";

      if (currentPage !== "category" && currentPage !== "tag") return;

      const groups = getGroups();
      const area = document.createElement("div");
      area.className = "group-list";

      groups.forEach(group => {
        const count = items.filter(item =>
          currentPage === "category"
            ? item.category === group
            : item.tags.includes(group)
        ).length;

        const button = document.createElement("button");
        button.className = "group-card" +
          (selectedGroup === group ? " active" : "");

        button.innerHTML = `
          <div class="group-name">${group}</div>
          <div class="group-count">${count} 則收藏</div>
        `;

        button.addEventListener("click", () => {
          selectedGroup = selectedGroup === group ? null : group;
          render();
        });

        area.appendChild(button);
      });

      groupArea.appendChild(area);
    }

    function getVisibleItems() {
      const keyword = document.getElementById("searchInput")
        .value.trim().toLowerCase();

      return items.filter(item => {
        if (currentPage === "unread" && item.read) return false;
        if (currentPage === "favorite" && !item.favorite) return false;

        if (currentPage === "category" && selectedGroup &&
            item.category !== selectedGroup) return false;

        if (currentPage === "tag" && selectedGroup &&
            !item.tags.includes(selectedGroup)) return false;

        if (currentFilter === "unread" && item.read) return false;
        if (currentFilter === "read" && !item.read) return false;

        const searchText = [
          item.title, item.category, ...item.tags
        ].join(" ").toLowerCase();

        if (keyword && !searchText.includes(keyword)) return false;

        return true;
      });
    }

    function renderItems() {
      const visible = getVisibleItems();
      itemList.innerHTML = "";

      if (!visible.length) {
        itemList.innerHTML = `
          <div class="empty">
            <div class="empty-icon">☁️</div>
            目前沒有符合條件的內容
          </div>
        `;
        return;
      }

      visible.forEach(item => {
        const card = document.createElement("article");
        card.className = "item";

        const icon = document.createElement("div");
        icon.className = "item-icon";
        icon.style.background = item.color;
        icon.textContent = item.icon;

        const info = document.createElement("div");
        info.className = "item-info";

        const title = document.createElement("div");
        title.className = "item-title";
        title.textContent = item.title;

        const meta = document.createElement("div");
        meta.className = "item-meta";
        meta.textContent = item.category +
          (item.read ? " · 已讀" : " · 未讀");

        const tags = document.createElement("div");
        tags.className = "item-tags";

        item.tags.forEach(tag => {
          const span = document.createElement("span");
          span.className = "mini-tag";
          span.textContent = tag;
          tags.appendChild(span);
        });

        info.append(title, meta, tags);

        const actions = document.createElement("div");
        actions.className = "item-actions";

        const favorite = document.createElement("button");
        favorite.className = "action-btn" +
          (item.favorite ? " selected" : "");
        favorite.textContent = item.favorite ? "♥" : "♡";
        favorite.setAttribute("aria-label", "切換收藏");
        favorite.addEventListener("click", () => {
          item.favorite = !item.favorite;
          render();
        });

        const read = document.createElement("button");
        read.className = "action-btn";
        read.textContent = item.read ? "↶" : "✓";
        read.setAttribute("aria-label", "切換已讀狀態");
        read.addEventListener("click", () => {
          item.read = !item.read;
          render();
        });

        actions.append(favorite, read);
        card.append(icon, info, actions);
        itemList.appendChild(card);
      });
    }

    function render() {
      const [title, description] = pageInfo[currentPage];

      document.getElementById("sectionTitle").textContent = title;
      document.getElementById("sectionNote").textContent = description;

      welcome.style.display = currentPage === "unread" ? "block" : "none";

      filterBar.style.display =
        ["category", "tag", "favorite"].includes(currentPage)
          ? "flex" : "none";

      document.querySelectorAll(".filter").forEach(button => {
        button.classList.toggle(
          "active", button.dataset.filter === currentFilter
        );
      });

      document.querySelectorAll(".nav-button").forEach(button => {
        button.classList.toggle(
          "active", button.dataset.page === currentPage
        );
      });

      renderGroups();
      renderItems();
      updateCount();
    }

    document.querySelectorAll(".nav-button").forEach(button => {
      button.addEventListener("click", () => {
        currentPage = button.dataset.page;
        currentFilter = "all";
        selectedGroup = null;
        render();
      });
    });

    document.querySelectorAll(".filter").forEach(button => {
      button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;
        render();
      });
    });

    document.getElementById("searchToggle").addEventListener("click", () => {
      document.getElementById("searchArea").classList.toggle("show");
      document.getElementById("searchInput").focus();
    });

    document.getElementById("searchInput").addEventListener("input", renderItems);

    // 接收 Android 分享過來的網址與標題，先顯示提示
    const params = new URLSearchParams(window.location.search);
    const sharedTitle = params.get("title") || "";
    const sharedText = params.get("text") || "";
    const sharedUrl = params.get("url") || "";

    if (sharedTitle || sharedText || sharedUrl) {
      const shared = document.createElement("div");
      shared.className = "welcome";
      shared.style.marginTop = "15px";
      shared.innerHTML = `
        <div class="welcome-label">收到分享內容</div>
        <div style="font-size:14px;margin-top:8px;overflow-wrap:anywhere">
          ${escapeHTML(sharedTitle || sharedText || sharedUrl)}
        </div>
        <div style="font-size:11px;margin-top:8px;color:#668B8E">
          分享接收畫面已啟動，下一步將加入正式儲存功能。
        </div>
      `;
      document.querySelector(".topbar").after(shared);
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
          .then(registration => {
            console.log("CULater Service Worker 已啟用", registration.scope);
          })
          .catch(error => {
            console.error("Service Worker 啟用失敗", error);
          });
      });
    }

    render();
  </script>
</body>
</html>
