
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#eaf4f3">
<link rel="manifest" href="./manifest.json">
<title>CULater｜稍後閱讀</title>
<style>
:root {
  --blue:#6d9eae;
  --green:#8bb9ad;
  --ink:#30434a;
  --muted:#829398;
  --paper:#f7faf9;
  --white:#fff;
  --line:#e5eeeb;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:Arial,"Noto Sans TC",sans-serif;
  font-size:16px;padding-bottom:100px
}
header{
  padding:22px 20px 14px;display:flex;
  align-items:center;justify-content:space-between
}
.brand{font-size:25px;font-weight:750;letter-spacing:-1px}
.brand span{color:var(--blue)}
.sub{font-size:12px;color:var(--muted);margin-top:4px}
.icon-btn{
  border:1px solid var(--line);background:white;border-radius:50%;
  width:42px;height:42px;font-size:19px;color:var(--ink)
}
main{padding:0 16px;max-width:700px;margin:auto}
.search{
  width:100%;border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;font-size:16px;background:white;outline:none
}
.section-head{
  display:flex;align-items:center;justify-content:space-between;
  margin:22px 2px 12px
}
.section-head h2{font-size:19px;margin:0}
.small{font-size:13px;color:var(--muted)}
.filters{display:flex;gap:8px;overflow:auto;margin:12px 0 16px}
.chip{
  border:1px solid var(--line);background:white;color:var(--muted);
  border-radius:30px;padding:8px 14px;white-space:nowrap;font-size:14px
}
.chip.active{background:#e4f0ef;color:#416d70;border-color:#d4e6e2}
.item{
  display:flex;gap:13px;background:white;border:1px solid var(--line);
  border-radius:16px;padding:12px;margin-bottom:10px;align-items:center
}
.thumb{
  width:82px;height:82px;flex-shrink:0;border-radius:11px;
  object-fit:cover;background:#e8f1ef
}
.item-info{min-width:0;flex:1}
.item-title{
  font-size:15px;font-weight:650;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden
}
.item-url{font-size:12px;color:var(--muted);margin-top:5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{
  font-size:11px;color:#527c78;background:#edf5f2;
  padding:4px 8px;border-radius:20px
}
.item-actions{display:flex;gap:8px;margin-top:8px}
.action{
  border:0;background:transparent;color:var(--muted);
  font-size:13px;padding:3px 0
}
.action.on{color:#d39a55}
.empty{text-align:center;padding:50px 15px;color:var(--muted)}
.fab{
  position:fixed;right:20px;bottom:92px;border:0;border-radius:50%;
  width:56px;height:56px;background:var(--blue);color:white;
  font-size:28px;box-shadow:0 5px 18px #6d9eae55
}
nav{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
  width:min(92%,460px);display:flex;justify-content:space-around;
  background:white;border:1px solid var(--line);border-radius:30px;
  padding:9px 6px;box-shadow:0 5px 25px #30434a18
}
nav button{
  border:0;background:transparent;color:var(--muted);
  padding:7px 12px;font-size:13px;border-radius:20px
}
nav button.active{background:#e5f1ef;color:#416d70;font-weight:700}
.modal{
  display:none;position:fixed;inset:0;background:#1e303b66;
  z-index:5;align-items:flex-end;justify-content:center
}
.modal.show{display:flex}
.panel{
  background:white;width:min(100%,600px);max-height:88vh;overflow:auto;
  border-radius:22px 22px 0 0;padding:22px 20px 35px
}
.panel h2{margin:0 0 18px;font-size:20px}
.field{margin:13px 0}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}
.field input,.field textarea,.field select{
  width:100%;padding:12px;border:1px solid var(--line);
  border-radius:11px;font-size:15px;background:white;color:var(--ink)
}
.primary{
  width:100%;padding:14px;border:0;border-radius:12px;
  background:var(--blue);color:white;font-size:16px;margin-top:12px
}
.secondary{
  padding:9px 12px;border:1px solid var(--line);background:white;
  border-radius:10px;color:var(--ink)
}
.manage-row{
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line);padding:12px 0
}
.manage-row button{margin-left:6px}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <div>
    <div class="brand">CU<span>Later</span></div>
    <div class="sub">Save now. Read later.</div>
  </div>
  <button class="icon-btn" onclick="openSettings()" aria-label="設定">⚙</button>
</header>

<main>
  <input id="search" class="search" placeholder="搜尋收藏內容……" oninput="render()">
  <div class="section-head">
    <h2 id="pageTitle">未讀收藏</h2>
    <span class="small" id="count"></span>
  </div>
  <div id="filters" class="filters"></div>
  <div id="items"></div>
</main>

<button class="fab" onclick="openAdd()">＋</button>

<nav>
  <button class="active" data-page="unread" onclick="setPage('unread',this)">未讀</button>
  <button data-page="category" onclick="setPage('category',this)">分類</button>
  <button data-page="tag" onclick="setPage('tag',this)">標籤</button>
  <button data-page="favorite" onclick="setPage('favorite',this)">最愛</button>
</nav>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="panel" id="panel"></div>
</div>

<script>
const KEY="culater-v2-data";
const defaults={
  categories:["旅行","居家","娛樂","美食","科技","其他"],
  tags:["待研究","想購買","靈感","攻略"],
  items:[]
};
let db=loadDB();
let page="unread", filter="all", selected="";

function loadDB(){
  try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}
  catch(e){return JSON.parse(JSON.stringify(defaults))}
}
function saveDB(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s=""){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))
}
function setPage(p,btn){
  page=p;selected="";filter="all";
  document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");render();
}
function setFilter(v){filter=v;render()}
function render(){
  const titles={unread:"未讀收藏",category:"分類收藏",tag:"標籤收藏",favorite:"最愛收藏"};
  document.getElementById("pageTitle").textContent=titles[page];
  let arr=[...db.items];
  if(page==="unread")arr=arr.filter(x=>!x.read);
  if(page==="favorite")arr=arr.filter(x=>x.favorite);
  if(page==="category"&&selected)arr=arr.filter(x=>x.category===selected);
  if(page==="tag"&&selected)arr=arr.filter(x=>(x.tags||[]).includes(selected));
  if(filter==="unread")arr=arr.filter(x=>!x.read);
  if(filter==="read")arr=arr.filter(x=>x.read);
  const q=document.getElementById("search").value.trim().toLowerCase();
  if(q)arr=arr.filter(x=>(x.title+" "+x.url+" "+x.note+" "+(x.tags||[]).join(" ")).toLowerCase().includes(q));
  document.getElementById("count").textContent=arr.length+" 筆";
  let f=document.getElementById("filters");
  f.innerHTML="";
  if(page!=="unread"){
    if(page==="category"||page==="tag"){
      const values=page==="category"?db.categories:db.tags;
      f.innerHTML=values.map(v=>`<button class="chip ${selected===v?"active":""}" onclick="selected=${JSON.stringify(v)};render()">${esc(v)}</button>`).join("");
    }
    f.innerHTML+=["all","unread","read"].map(v=>`<button class="chip ${filter===v?"active":""}" onclick="setFilter('${v}')">${({all:"全部",unread:"未讀",read:"已讀"})[v]}</button>`).join("");
  }
  const box=document.getElementById("items");
  if(!arr.length){box.innerHTML='<div class="empty">目前沒有收藏內容<br><br>點擊 ＋ 開始收藏</div>';return}
  box.innerHTML=arr.map(x=>`
    <article class="item">
      <img class="thumb" src="${x.image||placeholder()}" onerror="this.src='${placeholder()}'">
      <div class="item-info">
        <div class="item-title">${esc(x.title||"未命名收藏")}</div>
        <div class="item-url">${esc(x.url||"圖片收藏")}</div>
        <div class="meta">
          ${x.category?`<span class="tag">${esc(x.category)}</span>`:""}
          ${(x.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}
        </div>
        <div class="item-actions">
          <button class="action ${x.favorite?"on":""}" onclick="toggleFav('${x.id}')">${x.favorite?"★ 最愛":"☆ 最愛"}</button>
          <button class="action" onclick="toggleRead('${x.id}')">${x.read?"標記未讀":"標記已讀"}</button>
          <button class="action" onclick="editItem('${x.id}')">編輯</button>
        </div>
      </div>
    </article>`).join("");
}
function placeholder(){
  return "data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><rect width="100%" height="100%" fill="#e8f1ef"/><path d="M25 80 L50 48 L68 67 L82 55 L100 80" fill="none" stroke="#9bbdb5" stroke-width="4"/></svg>');
}
function toggleFav(id){let x=db.items.find(i=>i.id===id);x.favorite=!x.favorite;saveDB();render()}
function toggleRead(id){let x=db.items.find(i=>i.id===id);x.read=!x.read;saveDB();render()}
function openModal(html){document.getElementById("panel").innerHTML=html;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}

function openAdd(item=null){
  const x=item||{title:"",url:"",category:db.categories[0]||"",tags:[],note:"",image:""};
  openModal(`
    <h2>${item?"編輯收藏":"新增收藏"}</h2>
    <div class="field"><label>標題</label><input id="iTitle" value="${esc(x.title)}" placeholder="輸入標題"></div>
    <div class="field"><label>網址（圖片收藏可留空）</label><input id="iUrl" value="${esc(x.url)}" placeholder="https://"></div>
    <div class="field"><label>圖片</label><input id="iFile" type="file" accept="image/*"></div>
    <div class="field"><label>分類</label><select id="iCategory">${db.categories.map(c=>`<option ${x.category===c?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
    <div class="field"><label>標籤（可複選）</label>${db.tags.map(t=>`<label><input type="checkbox" class="iTag" value="${esc(t)}" ${(x.tags||[]).includes(t)?"checked":""}> ${esc(t)}</label>`).join(" ")}</div>
    <div class="field"><label>備註</label><textarea id="iNote" rows="3">${esc(x.note)}</textarea></div>
    <button class="primary" onclick="saveItem('${item?item.id:""}')">保存收藏</button>
    <button class="secondary" style="width:100%;margin-top:10px" onclick="closeModal()">取消</button>
  `);
  window.currentImage=x.image||"";
}
function saveItem(id){
  const file=document.getElementById("iFile").files[0];
  const finish=()=>{
    const obj={
      id:id||String(Date.now()),
      title:document.getElementById("iTitle").value.trim()||"未命名收藏",
      url:document.getElementById("iUrl").value.trim(),
      category:document.getElementById("iCategory").value,
      tags:[...document.querySelectorAll(".iTag:checked")].map(e=>e.value),
      note:document.getElementById("iNote").value,
      image:window.currentImage||"",
      read:false,favorite:false
    };
    const old=db.items.find(x=>x.id===id);
    if(old){obj.read=old.read;obj.favorite=old.favorite;db.items=db.items.map(x=>x.id===id?obj:x)}
    else db.items.unshift(obj);
    try{saveDB();closeModal();render()}
    catch(e){alert("本機儲存空間不足，請先使用較小的圖片。")}
  };
  if(file){
    if(file.size>800*1024){alert("目前本機測試版單張圖片請小於 800KB。雲端圖片上傳會在下一階段完成。");return}
    const reader=new FileReader();
    reader.onload=()=>{window.currentImage=reader.result;finish()};
    reader.readAsDataURL(file);
  }else finish();
}
function editItem(id){openAdd(db.items.find(x=>x.id===id))}
function openSettings(){
  openModal(`
    <h2>管理設定</h2>
    <button class="secondary" style="width:100%;margin-bottom:10px" onclick="manage('category')">分類管理</button>
    <button class="secondary" style="width:100%;margin-bottom:10px" onclick="manage('tag')">標籤管理</button>
    <button class="secondary" style="width:100%" onclick="closeModal()">返回</button>
  `);
}
function manage(type){
  const isCat=type==="category", list=isCat?db.categories:db.tags;
  const title=isCat?"分類管理":"標籤管理";
  openModal(`<h2>${title}</h2>
    <div class="field"><input id="newValue" placeholder="輸入新${isCat?"分類":"標籤"}名稱"></div>
    <button class="primary" onclick="addValue('${type}')">新增</button>
    <div style="margin-top:18px">${list.map(v=>`
      <div class="manage-row"><span>${esc(v)}</span><span>
      <button class="secondary" onclick="renameValue('${type}',${JSON.stringify(v)})">改名</button>
      <button class="secondary" onclick="deleteValue('${type}',${JSON.stringify(v)})">刪除</button>
      </span></div>`).join("")}</div>
    <button class="secondary" style="width:100%;margin-top:16px" onclick="openSettings()">返回設定</button>`);
}
function addValue(type){
  const v=document.getElementById("newValue").value.trim();
  if(!v)return;
  const list=type==="category"?db.categories:db.tags;
  if(list.includes(v)){alert("名稱已存在");return}
  list.push(v);saveDB();manage(type);
}
function renameValue(type,old){
  const v=prompt("請輸入新名稱",old);
  if(!v||!v.trim())return;
  const name=v.trim(),list=type==="category"?db.categories:db.tags;
  if(list.includes(name)){alert("名稱已存在");return}
  const i=list.indexOf(old);list[i]=name;
  db.items.forEach(x=>{
    if(type==="category"&&x.category===old)x.category=name;
    if(type==="tag")x.tags=(x.tags||[]).map(t=>t===old?name:t);
  });
  saveDB();manage(type);
}
function deleteValue(type,v){
  if(!confirm(`確定刪除「${v}」？收藏內容不會被刪除。`))return;
  if(type==="category"){
    db.categories=db.categories.filter(x=>x!==v);
    db.items.forEach(x=>{if(x.category===v)x.category=""});
  }else{
    db.tags=db.tags.filter(x=>x!==v);
    db.items.forEach(x=>x.tags=(x.tags||[]).filter(t=>t!==v));
  }
  saveDB();manage(type);
}

// 接收目前 manifest GET 分享的網址資料
const params=new URLSearchParams(location.search);
const sharedUrl=params.get("url")||"";
const sharedTitle=params.get("title")||params.get("text")||"";
if(sharedUrl){
  setTimeout(()=>{
    if(confirm("要將分享的網址加入 CULater 嗎？")){
      db.items.unshift({
        id:String(Date.now()),title:sharedTitle||sharedUrl,url:sharedUrl,
        category:db.categories[0]||"",tags:[],note:"",
        image:"",read:false,favorite:false
      });
      saveDB();render();
    }
    history.replaceState({},document.title,location.pathname);
  },300);
}

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./service-worker.js").catch(console.error);
  });
}
render();
</script>
</body>
</html>
