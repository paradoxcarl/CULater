
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#eaf4f3">
<link rel="manifest" href="./manifest.json">
<title>CULater｜稍後閱讀</title>

<style>
:root{
  --blue:#6d9eae;
  --green:#8bb9ad;
  --ink:#30434a;
  --muted:#829398;
  --paper:#f5f9f8;
  --white:#fff;
  --line:#e5eeeb;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:Arial,"Noto Sans TC",sans-serif;
  font-size:16px;padding-bottom:105px;
}
header{
  padding:22px 20px 14px;display:flex;
  align-items:center;justify-content:space-between;
}
.brand{font-size:26px;font-weight:750;letter-spacing:-1px}
.brand span{color:var(--blue)}
.sub{font-size:12px;color:var(--muted);margin-top:4px}
.icon-btn{
  border:1px solid var(--line);background:white;border-radius:50%;
  width:42px;height:42px;fon
  t-size:19px;color:var(--ink);
  cursor:pointer;
}
main{padding:0 16px;max-width:700px;margin:auto}
.search{
  width:100%;border:1px solid var(--line);border-radius:15px;
  padding:14px 16px;font-size:16px;background:white;outline:none;
  transition:.2s;
}
.search:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px #6d9eae18;
}
.section-head{
  display:flex;align-items:center;justify-content:space-between;
  margin:22px 2px 12px;
}
.section-head h2{font-size:19px;margin:0}
.small{font-size:13px;color:var(--muted)}
.filters,.group-filters{
  display:flex;gap:8px;overflow-x:auto;
  margin:12px 0 13px;padding:2px 1px 5px;
  scrollbar-width:none;
}
.filters::-webkit-scrollbar,.group-filters::-webkit-scrollbar{display:none}
.chip{
  border:1px solid var(--line);background:white;color:var(--muted);
  border-radius:30px;padding:9px 15px;white-space:nowrap;
  font-size:14px;cursor:pointer;transition:.2s;
}
.chip.active{
  background:#e4f0ef;color:#416d70;border-color:#d4e6e2;
  font-weight:650;
}
.chip:active{transform:scale(.96)}
.item{
  display:flex;gap:13px;background:white;border:1px solid var(--line);
  border-radius:17px;padding:12px;margin-bottom:11px;align-items:center;
  transition:transform .2s,box-shadow .2s,opacity .2s;
  animation:appear .25s ease both;
}
@keyframes appear{
  from{opacity:0;transform:translateY(7px)}
  to{opacity:1;transform:translateY(0)}
}
.item:active{box-shadow:0 5px 18px #30434a12}
.item.sortable-ghost,.manage-row.sortable-ghost,.chip.sortable-ghost{
  opacity:.3;background:#dcece8;
}
.item.sortable-chosen,.manage-row.sortable-chosen{
  box-shadow:0 8px 25px #30434a20;
}
.drag-handle{
  color:#a9b9b8;font-size:19px;cursor:grab;
  touch-action:none;user-select:none;padding:3px;
}
.drag-handle:active{cursor:grabbing}
.thumb{
  width:82px;height:82px;flex-shrink:0;border-radius:12px;
  object-fit:cover;background:#e8f1ef;
}
.item-info{min-width:0;flex:1}
.item-title{
  font-size:15px;font-weight:650;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;
}
.item-url{
  font-size:12px;color:var(--muted);margin-top:5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{
  font-size:11px;color:#527c78;background:#edf5f2;
  padding:4px 8px;border-radius:20px;
}
.item-actions{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
.action{
  border:0;background:transparent;color:var(--muted);
  font-size:13px;padding:3px 0;cursor:pointer;
}
.action.on{color:#d39a55}
.empty{text-align:center;padding:55px 15px;color:var(--muted)}
.fab{
  position:fixed;right:20px;bottom:94px;border:0;border-radius:50%;
  width:57px;height:57px;background:var(--blue);color:white;
  font-size:29px;box-shadow:0 5px 18px #6d9eae55;
  cursor:pointer;transition:.2s;z-index:3;
}
.fab:active{transform:scale(.9)}
nav{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
  width:min(92%,460px);display:flex;justify-content:space-around;
  background:white;border:1px solid var(--line);border-radius:30px;
  padding:9px 6px;box-shadow:0 5px 25px #30434a18;z-index:4;
}
nav button{
  border:0;background:transparent;color:var(--muted);
  padding:9px 13px;font-size:13px;border-radius:20px;
  cursor:pointer;transition:.2s;
}
nav button.active{
  background:#e5f1ef;color:#416d70;font-weight:700;
}
.modal{
  display:none;position:fixed;inset:0;background:#1e303b66;
  z-index:5;align-items:flex-end;justify-content:center;
}
.modal.show{display:flex}
.panel{
  background:white;width:min(100%,600px);max-height:90vh;overflow:auto;
  border-radius:22px 22px 0 0;padding:23px 20px 35px;
  animation:slideUp .25s ease;
}
@keyframes slideUp{
  from{transform:translateY(35px);opacity:.6}
  to{transform:translateY(0);opacity:1}
}
.panel h2{margin:0 0 18px;font-size:20px}
.field{margin:14px 0}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}
.field input,.field textarea,.field select{
  width:100%;padding:12px;border:1px solid var(--line);
  border-radius:11px;font-size:15px;background:white;color:var(--ink);
}
.primary{
  width:100%;padding:14px;border:0;border-radius:12px;
  background:var(--blue);color:white;font-size:16px;margin-top:12px;
  cursor:pointer;
}
.secondary{
  padding:9px 12px;border:1px solid var(--line);
  background:white;border-radius:10px;color:var(--ink);
  cursor:pointer;
}
.manage-row{
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line);padding:13px 2px;
  background:white;gap:8px;
}
.manage-name{display:flex;align-items:center;gap:10px;min-width:0}
.manage-buttons{display:flex;gap:6px;flex-shrink:0}
.manage-buttons button{font-size:12px}
.manage-hint{
  font-size:12px;color:var(--muted);margin:0 0 12px;
}
.group-title{
  font-size:12px;color:var(--muted);margin:16px 3px 7px;
}
.hidden{display:none!important}

  .icon-action{
  min-width:36px;
  min-height:36px;
  padding:4px;
  font-size:19px;
  line-height:1;
  border-radius:10px;
}

.delete-action{
  color:#b65c5c;
}
</style>
</head>

<body>
<header>
  <div>
    <div class="brand">CU<span>Later</span></div>
    <div class="sub">Save now. Read later.</div>
  </div>
  <button class="icon-btn" id="settingsBtn" aria-label="設定">⚙</button>
</header>

<main>
  <input id="search" class="search" placeholder="搜尋收藏內容……">

  <div class="section-head">
    <h2 id="pageTitle">未讀收藏</h2>
    <span class="small" id="count"></span>
  </div>

  <div id="filters" class="filters"></div>
  <div id="groupFilters" class="group-filters"></div>
  <div id="items"></div>
</main>

<button class="fab" id="addBtn">＋</button>

<nav>
  <button class="active" data-page="unread">未讀</button>
  <button data-page="category">分類</button>
  <button data-page="tag">標籤</button>
  <button data-page="favorite">最愛</button>
</nav>

<div class="modal" id="modal">
  <div class="panel" id="panel"></div>
</div>

<!-- SortableJS：支援手機觸控與滑鼠拖拉 -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>

<script>
const KEY="culater-v2-data";

const defaults={
  categories:["旅行","居家","娛樂","美食","科技","其他"],
  tags:["待研究","想購買","靈感","攻略"],
  items:[]
};

let db=loadDB();
const VIEW_KEY="culater-v2-view";
const savedView=loadViewState();
let page=savedView.page||"unread";
let filter=savedView.filter||"all";
let selected=savedView.selected||"";
let modalHistoryActive=false;

function loadViewState(){
  try{
    const value=JSON.parse(localStorage.getItem(VIEW_KEY)||"{}");
    return value&&typeof value==="object"?value:{};
  }catch(e){return {};}
}

function saveViewState(){
  try{
    localStorage.setItem(VIEW_KEY,JSON.stringify({
      page,filter,selected,search:document.getElementById("search")?.value||""
    }));
  }catch(e){console.warn("無法保存目前頁面狀態",e);}
}
let currentManageType="";
let currentImage="";
let sortInstances=[];

function loadDB(){
  try{
    const saved=JSON.parse(localStorage.getItem(KEY));
    if(!saved)return JSON.parse(JSON.stringify(defaults));

    return {
      categories:Array.isArray(saved.categories)?saved.categories:defaults.categories,
      tags:Array.isArray(saved.tags)?saved.tags:defaults.tags,
      items:Array.isArray(saved.items)?saved.items:[]
    };
  }catch(e){
    return JSON.parse(JSON.stringify(defaults));
  }
}

function saveDB(){
  localStorage.setItem(KEY,JSON.stringify(db));
}

function esc(s=""){
  return String(s).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function placeholder(){
  return "data:image/svg+xml,"+encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><rect width="100%" height="100%" fill="#e8f1ef"/><path d="M25 80 L50 48 L68 67 L82 55 L100 80" fill="none" stroke="#9bbdb5" stroke-width="4"/></svg>'
  );
}

function setPage(p){
  page=p;
  selected="";
  filter="all";
  saveViewState();

  document.querySelectorAll("nav button").forEach(b=>{
    b.classList.toggle("active",b.dataset.page===p);
  });

  render();
}

function setFilter(v){
  filter=v;
  saveViewState();
  render();
}

function render(){
  destroySortables();
  const titles={
    unread:"未讀收藏",
    category:"分類收藏",
    tag:"標籤收藏",
    favorite:"最愛收藏"
  };

  document.getElementById("pageTitle").textContent=titles[page];

  let arr=[...db.items];

  if(page==="unread")arr=arr.filter(x=>!x.read);
  if(page==="favorite")arr=arr.filter(x=>x.favorite);
  if(page==="category"&&selected)arr=arr.filter(x=>x.category===selected);
  if(page==="tag"&&selected)arr=arr.filter(x=>(x.tags||[]).includes(selected));

  if(filter==="unread")arr=arr.filter(x=>!x.read);
  if(filter==="read")arr=arr.filter(x=>x.read);

  const q=document.getElementById("search").value.trim().toLowerCase();

  if(q){
    arr=arr.filter(x=>
      ((x.title||"")+" "+(x.url||"")+" "+(x.note||"")+" "+(x.tags||[]).join(" "))
      .toLowerCase().includes(q)
    );
  }

  document.getElementById("count").textContent=arr.length+" 筆";

  // 第一排：全部／未讀／已讀
  const f=document.getElementById("filters");
  f.innerHTML="";

  if(page==="category"||page==="tag"||page==="favorite"){
    f.innerHTML=["all","unread","read"].map(v=>`
      <button class="chip ${filter===v?"active":""}" data-action="filter" data-value="${v}">
        ${{all:"全部",unread:"未讀",read:"已讀"}[v]}
      </button>
    `).join("");
  }

  // 第二排：分類或標籤
  const gf=document.getElementById("groupFilters");
  gf.innerHTML="";

  if(page==="category"||page==="tag"){
    const values=page==="category"?db.categories:db.tags;

    gf.innerHTML=values.map(v=>`
      <button class="chip ${selected===v?"active":""}" data-action="select-group" data-value="${esc(v)}">
        ${esc(v)}
      </button>
    `).join("");
  }

  const box=document.getElementById("items");

  if(!arr.length){
    box.innerHTML='<div class="empty">目前沒有收藏內容<br><br>點擊 ＋ 開始收藏</div>';
    destroySortables();
    return;
  }

  box.innerHTML=arr.map(x=>`
    <article class="item" data-id="${esc(x.id)}">
      <div class="drag-handle" title="拖拉排序">⠿</div>
      <img class="thumb" src="${x.image||placeholder()}" onerror="this.src='${placeholder()}'">
      <div class="item-info">
        <div class="item-title">${esc(x.title||"未命名收藏")}</div>
        <div class="item-url">${esc(x.url||"圖片收藏")}</div>
        <div class="meta">
          ${x.category?`<span class="tag">${esc(x.category)}</span>`:""}
          ${(x.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}
        </div>
        <div class="item-actions">
          <button class="action ${x.favorite?"on":""}" data-action="favorite" data-id="${esc(x.id)}">
        
<div class="item-actions">
  <button class="action icon-action ${x.favorite?"on":""}"
    data-action="favorite"
    data-id="${esc(x.id)}"
    title="最愛"
    aria-label="最愛">
    ${x.favorite?"★":"☆"}
  </button>

  <button class="action icon-action"
    data-action="read"
    data-id="${esc(x.id)}"
    title="${x.read?"標記未讀":"標記已讀"}"
    aria-label="${x.read?"標記未讀":"標記已讀"}">
    ${x.read?"◉":"✓"}
  </button>

  <button class="action icon-action"
    data-action="edit-item"
    data-id="${esc(x.id)}"
    title="編輯"
    aria-label="編輯">
    ✎
  </button>

  <button class="action icon-action delete-action"
    data-action="delete"
    data-id="${esc(x.id)}"
    title="刪除"
    aria-label="刪除">
    ♲
  </button>
</div>

      </div>
    </article>
  `).join("");

  initItemSortable();
  initChipSortable();
}

function destroySortables(){
  sortInstances.forEach(s=>s.destroy());
  sortInstances=[];
}

function initItemSortable(){
  if(typeof Sortable==="undefined")return;
    loadItemsBeforeReorder=[...db.items];
  const box=document.getElementById("items");

  const s=Sortable.create(box,{
    handle:".drag-handle",
    animation:180,
    ghostClass:"sortable-ghost",
    chosenClass:"sortable-chosen",
    delay:120,
    delayOnTouchOnly:true,
    touchStartThreshold:5,
    onEnd:function(){
  const ids=[...box.querySelectorAll(".item")]
    .map(el=>el.dataset.id)
    .filter(Boolean);

  if(ids.length>1){
    reorderItems(ids);
  }
}
  });

  sortInstances.push(s);
}

function reorderItems(visibleIds) {
  const snapshot = loadItemsBeforeReorder || [...db.items];
  const visibleSet = new Set(visibleIds);
  const byId = new Map(snapshot.map(item => [item.id, item]));

  let cursor = 0;

  db.items = snapshot.map(item => {
    if (visibleSet.has(item.id)) {
      return byId.get(visibleIds[cursor++]) || item;
    }
    return item;
  });

  loadItemsBeforeReorder = null;
  saveDB();
}
let loadItemsBeforeReorder=null;

// 以拖拉後的顯示順序更新分類或標籤
function initChipSortable(){
  if(typeof Sortable==="undefined")return;
  if(page!=="category"&&page!=="tag")return;

  const gf=document.getElementById("groupFilters");
  if(!gf.children.length)return;

  const type=page;
  const s=Sortable.create(gf,{
    animation:180,
    ghostClass:"sortable-ghost",
    onEnd:function(){
      const values=[...gf.children].map(el=>el.dataset.value);
      if(type==="category")db.categories=values;
      else db.tags=values;
      saveDB();
      render();
    }
  });
  sortInstances.push(s);
}

function toggleFav(id){
  const x=db.items.find(i=>i.id===id);
  if(!x)return;
  x.favorite=!x.favorite;
  saveDB();render();
}

function toggleRead(id){
  const x=db.items.find(i=>i.id===id);
  if(!x)return;
  x.read=!x.read;
  saveDB();render();
}

function openModal(html){
  destroySortables();
  document.getElementById("panel").innerHTML=html;
  document.getElementById("modal").classList.add("show");

  // 建立一個瀏覽紀錄，讓 Android 返回鍵先關閉編輯視窗，而不是離開 PWA
  if(!modalHistoryActive){
    modalHistoryActive=true;
    history.pushState({culaterModal:true},"",location.href);
  }
}

function closeModal(fromBackButton=false){
  const modal=document.getElementById("modal");
  if(!modal.classList.contains("show"))return;

  modal.classList.remove("show");
  render();

  // 使用畫面上的取消／關閉按鈕時，同步移除剛才新增的歷史紀錄
  if(modalHistoryActive&&!fromBackButton){
    modalHistoryActive=false;
    history.back();
  }else{
    modalHistoryActive=false;
  }
}

// Android 系統返回鍵／手勢返回：優先取消目前開啟的編輯或管理視窗
window.addEventListener("popstate",()=>{
  const modal=document.getElementById("modal");
  if(modal&&modal.classList.contains("show")){
    closeModal(true);
  }
});

function openAdd(item=null){
  const x=item||{
    title:"",url:"",category:db.categories[0]||"",
    tags:[],note:"",image:""
  };

  currentImage=x.image||"";

  openModal(`
    <h2>${item?"編輯收藏":"新增收藏"}</h2>

    <div class="field">
      <label>標題</label>
      <input id="iTitle" value="${esc(x.title)}" placeholder="輸入標題">
    </div>

    <div class="field">
      <label>網址（圖片收藏可留空）</label>
      <input id="iUrl" value="${esc(x.url)}" placeholder="https://">
    </div>

    <div class="field">
      <label>圖片</label>
      <input id="iFile" type="file" accept="image/*">
    </div>

    <div class="field">
      <label>分類</label>
      <select id="iCategory">
        ${db.categories.map(c=>`
          <option value="${esc(c)}" ${x.category===c?"selected":""}>${esc(c)}</option>
        `).join("")}
      </select>
    </div>

    <div class="field">
      <label>標籤（可複選）</label>
      <div>
        ${db.tags.map(t=>`
          <label style="display:inline-flex;align-items:center;margin:5px 9px 5px 0;color:var(--ink)">
            <input type="checkbox" class="iTag" value="${esc(t)}" ${(x.tags||[]).includes(t)?"checked":""}>
            ${esc(t)}
          </label>
        `).join("")}
      </div>
    </div>

    <div class="field">
      <label>備註</label>
      <textarea id="iNote" rows="3">${esc(x.note)}</textarea>
    </div>

    <button class="primary" id="saveItemBtn" data-id="${item?esc(item.id):""}">
      保存收藏
    </button>
    <button class="secondary" style="width:100%;margin-top:10px" id="cancelBtn">取消</button>
  `);
}

function saveItem(id){
  const file=document.getElementById("iFile").files[0];

  const finish=()=>{
    const old=db.items.find(x=>x.id===id);

    const obj={
      id:id||String(Date.now()),
      title:document.getElementById("iTitle").value.trim()||"未命名收藏",
      url:document.getElementById("iUrl").value.trim(),
      category:document.getElementById("iCategory").value,
      tags:[...document.querySelectorAll(".iTag:checked")].map(e=>e.value),
      note:document.getElementById("iNote").value,
      image:currentImage,
      read:old?old.read:false,
      favorite:old?old.favorite:false
    };

    if(old){
      db.items=db.items.map(x=>x.id===id?obj:x);
    }else{
      db.items.unshift(obj);
    }

    try{
      saveDB();
      closeModal();
    }catch(e){
      alert("本機儲存空間不足，請使用較小的圖片。");
    }
  };

  if(file){
    if(file.size>800*1024){
      alert("目前本機測試版單張圖片請小於 800KB。雲端圖片上傳會在下一階段完成。");
      return;
    }

    const reader=new FileReader();
    reader.onload=()=>{
      currentImage=reader.result;
      finish();
    };
    reader.readAsDataURL(file);
  }else{
    finish();
  }
}

function openSettings(){
  openModal(`
    <h2>管理設定</h2>
    <button class="secondary" style="width:100%;margin-bottom:10px" data-action="manage" data-type="category">分類管理</button>
    <button class="secondary" style="width:100%;margin-bottom:10px" data-action="manage" data-type="tag">標籤管理</button>
    <button class="secondary" style="width:100%" id="closeSettings">返回</button>
  `);
}

function manage(type){
  currentManageType=type;
  const isCat=type==="category";
  const list=isCat?db.categories:db.tags;
  const title=isCat?"分類管理":"標籤管理";

  openModal(`
    <h2>${title}</h2>
    <p class="manage-hint">按住左側拖拉圖示，即可調整順序。</p>

    <div class="field">
      <input id="newValue" placeholder="輸入新${isCat?"分類":"標籤"}名稱">
    </div>
    <button class="primary" id="addValueBtn">新增${isCat?"分類":"標籤"}</button>

    <div id="manageList" style="margin-top:18px">
      ${list.map(v=>`
        <div class="manage-row" data-value="${esc(v)}">
          <div class="manage-name">
            <span class="drag-handle">⠿</span>
            <span>${esc(v)}</span>
          </div>
          <div class="manage-buttons">
            <button class="secondary" data-action="rename" data-value="${esc(v)}">改名</button>
            <button class="secondary" data-action="delete" data-value="${esc(v)}">刪除</button>
          </div>
        </div>
      `).join("")}
    </div>

    <button class="secondary" style="width:100%;margin-top:17px" data-action="back-settings">返回設定</button>
  `);

  initManageSortable(type);
}

function initManageSortable(type){
  if(typeof Sortable==="undefined")return;

  const list=document.getElementById("manageList");
  if(!list)return;

  const s=Sortable.create(list,{
    handle:".drag-handle",
    animation:180,
    ghostClass:"sortable-ghost",
    chosenClass:"sortable-chosen",
    delay:120,
    delayOnTouchOnly:true,
    touchStartThreshold:5,
    onEnd:function(){
      const values=[...list.children].map(el=>el.dataset.value);

      if(type==="category")db.categories=values;
      else db.tags=values;

      saveDB();
    }
  });

  sortInstances.push(s);
}

function addValue(type){
  const input=document.getElementById("newValue");
  const v=input.value.trim();
  if(!v)return;

  const list=type==="category"?db.categories:db.tags;

  if(list.includes(v)){
    alert("名稱已存在");
    return;
  }

  list.push(v);
  saveDB();
  manage(type);
}

function renameValue(type,old){
  const v=prompt("請輸入新的名稱：",old);
  if(v===null)return;

  const name=v.trim();
  if(!name)return;

  const list=type==="category"?db.categories:db.tags;

  if(name!==old&&list.includes(name)){
    alert("名稱已存在，請使用其他名稱。");
    return;
  }

  const index=list.indexOf(old);
  if(index<0)return;

  list[index]=name;

  db.items.forEach(x=>{
    if(type==="category"&&x.category===old)x.category=name;
    if(type==="tag")x.tags=(x.tags||[]).map(t=>t===old?name:t);
  });

  if(selected===old)selected=name;

  saveDB();
  manage(type);
}

function deleteValue(type,v){
  if(!confirm(`確定刪除「${v}」？收藏內容不會被刪除。`))return;

  if(type==="category"){
    db.categories=db.categories.filter(x=>x!==v);
    db.items.forEach(x=>{
      if(x.category===v)x.category="";
    });
  }else{
    db.tags=db.tags.filter(x=>x!==v);
    db.items.forEach(x=>{
      x.tags=(x.tags||[]).filter(t=>t!==v);
    });
  }

  if(selected===v)selected="";

  saveDB();
  manage(type);
}

// 統一事件綁定：避免動態 HTML 的引號造成按鈕失效
document.addEventListener("click",e=>{
  const button=e.target.closest("button");
  if(!button)return;

  if(button.dataset.page){
    setPage(button.dataset.page);
    return;
  }

  const action=button.dataset.action;

  if(action==="filter"){
    setFilter(button.dataset.value);
  }else if(action==="select-group"){
    selected=selected===button.dataset.value?"":button.dataset.value;
    saveViewState();
    render();
  }else if(action==="favorite"){
    toggleFav(button.dataset.id);
  }else if(action==="read"){
    toggleRead(button.dataset.id);
  }else if(action==="edit-item"){
    const item=db.items.find(x=>x.id===button.dataset.id);
    if(item)openAdd(item);
  }else if(action==="delete"){
  deleteItem(button.dataset.id);
  }else if(action==="manage"){
    manage(button.dataset.type);
  }else if(action==="rename"){
    renameValue(currentManageType,button.dataset.value);
  }else if(action==="delete"){
    deleteValue(currentManageType,button.dataset.value);
  }else if(action==="back-settings"){
    openSettings();
  }
});

function deleteItem(id){
  const item=db.items.find(x=>x.id===id);
  if(!item)return;

  if(!confirm("確定要刪除這筆收藏嗎？\n刪除後無法復原。")){
    return;
  }

  db.items=db.items.filter(x=>x.id!==id);
  saveDB();
  render();
}
  

// 點擊收藏卡片，直接開啟原始網址
document.addEventListener("click", e => {
  const card = e.target.closest(".item");
  if (!card) return;

  // 避免點擊按鈕或拖曳把手時開啟網址
  if (e.target.closest("button, .drag-handle")) return;

  const item = db.items.find(x => x.id === card.dataset.id);

  if (item && item.url) {
    try {
      const url = new URL(item.url);

      if (url.protocol === "http:" || url.protocol === "https:") {
        window.open(url.href, "_blank", "noopener,noreferrer");
      }
    } catch (error) {
      console.warn("無效的收藏網址", error);
    }
  }
});



// 還原上次使用的主選單、篩選與搜尋文字
const searchInput=document.getElementById("search");
if(savedView.search)searchInput.value=savedView.search;
searchInput.addEventListener("input",()=>{
  saveViewState();
  render();
});
document.getElementById("settingsBtn").addEventListener("click",openSettings);
document.getElementById("addBtn").addEventListener("click",()=>openAdd());

document.getElementById("modal").addEventListener("click",e=>{
  if(e.target.id==="modal")closeModal();
});

document.getElementById("panel").addEventListener("click",e=>{
  if(e.target.id==="closeSettings")closeModal();
  if(e.target.id==="cancelBtn")closeModal();

  if(e.target.id==="addValueBtn")addValue(currentManageType);

  if(e.target.id==="saveItemBtn"){
    saveItem(e.target.dataset.id);
  }
});


// 自動接收 Facebook、LINE 等 App 分享的內容
const params = new URLSearchParams(location.search);

const sharedTitle = params.get("title") || "";
const sharedText = params.get("text") || "";
const directUrl = params.get("url") || "";

// 從分享文字中自動尋找網址
const urlMatch = sharedText.match(/https?:\/\/[^\s<>"']+/i);

let sharedUrl = directUrl || (urlMatch ? urlMatch[0] : "");

// 清除網址尾端常見標點符號
sharedUrl = sharedUrl.replace(/[。，、！!？?）)\]】]+$/g, "");

// 整理標題與備註
const textWithoutUrl = sharedText
  .replace(sharedUrl, "")
  .trim();

const finalTitle =
  sharedTitle ||
  textWithoutUrl ||
  sharedUrl ||
  "分享內容";

const finalNote = textWithoutUrl;

// 只要有網址或文字，就自動新增
if (sharedUrl || sharedText || sharedTitle) {
  const isDuplicate = db.items.some(item =>
    sharedUrl &&
    item.url &&
    item.url === sharedUrl
  );

  if (!isDuplicate) {
    db.items.unshift({
      id: String(Date.now()),
      title: finalTitle,
      url: sharedUrl,
      category: db.categories[0] || "",
      tags: [],
      note: finalNote,
      image: "",
      read: false,
      favorite: false
    });

    saveDB();
    render();

    alert("已成功加入 CULater！");
  } else {
    alert("這筆內容已經收藏過了！");
  }

  // 清除分享參數，避免重新整理時重複處理
  history.replaceState({}, document.title, location.pathname);
}


if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./service-worker.js").catch(console.error);
  });
}

render();
</script>
